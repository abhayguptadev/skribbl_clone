version: '3.8'

services:
  redis:
    image: redis:7.2-alpine
    container_name: skribbl_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - skribbl_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skribbl_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=production-secret-key-skribbl-multiplayer-2026
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - sqlite_data:/app/db_data
    depends_on:
      - redis
    networks:
      - skribbl_network

volumes:
  sqlite_data:

networks:
  skribbl_network:
    driver: bridge
